[workspace]
members = [
    "engine-core",
    "engine-browser",
    "engine-fs",
    "engine-comms",
    "engine-location",
    "engine-input",
    "engine-network",
    "engine-social",
    "engine-system",
    "engine-pipeline",
    "demo",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSL-1.1"
repository = "https://github.com/thepictishbeast/PlausiDen-Engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
md-5 = "0.11"
tracing = "0.1"
url = "2"
fake = { version = "5", features = ["derive"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
# Secret-material hygiene. Used by engine-core::erasure and any module
# holding key material; ZeroizeOnDrop + constant-time zero on drop.
zeroize = { version = "1", features = ["derive"] }
# Constant-time comparisons for secret equality tests (passphrases,
# MACs, etc.). Use `subtle::ConstantTimeEq` instead of `==`.
subtle = "2"
# Raw syscalls for mlock / munlock / madvise on Unix. Windows path
# uses windows-sys when engine-core gets Windows support.
libc = "0.2"
# Ed25519 signing for ErasureReceipt (engine-core::erasure, task #47).
# `std` default feature off keeps the door open for no_std consumers;
# `rand_core` feature gives us SigningKey::generate(rng).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }

# Internal crates
engine-core = { path = "engine-core" }
engine-browser = { path = "engine-browser" }
engine-fs = { path = "engine-fs" }
engine-network = { path = "engine-network" }
