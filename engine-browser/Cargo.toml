[package]
name = "engine-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser artifact generation — history, cookies, searches, bookmarks. WASM-compatible."

[dependencies]
engine-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance"] }
# Two getrandom majors are pulled in transitively (0.2 via rand 0.8.x +
# rand_core 0.6 + ed25519-dalek 2.x; 0.3 via the wasm-engine path).
# Each major gates wasm32 support behind a different feature: 0.2 uses
# `js`, 0.3 uses `wasm_js`. We must pull both with the right feature to
# get cargo's feature-unification to flip the wasm32 guard. Without
# the 0.2 entry the build fails with `compile_error!("the wasm*-
# unknown-unknown targets are not supported by default ...")`.
# REGRESSION-GUARD: 2026-04-27 — do not collapse to a single version
# until the rand 0.8 → 0.9 migration retires the 0.2 transitive line.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# uuid 1.x defers wasm32 randomness to a feature the way getrandom does.
# `js` makes it use the browser's Web Crypto via getrandom_02.
# REGRESSION-GUARD: 2026-04-27 — same cargo-features-unification trick;
# remove when uuid no longer ships its own wasm32 compile_error!.
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }
engine-fs = { workspace = true }
engine-network = { workspace = true }
