[package]
name = "engine-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core traits, types, and scheduling for the PlausiDen data generation engine"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Secret-material hygiene for engine-core::erasure (task #22).
zeroize = { workspace = true }
# Constant-time compare for engine-core::duress (task #23).
subtle = { workspace = true }
# Ed25519 signing for engine-core::erasure::ErasureReceipt (task #47).
ed25519-dalek = { workspace = true }
# Raw syscalls for mlock/munlock/madvise in engine-core::erasure (Unix).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Linux landlock — engine-core::sandbox runtime hardening for
# binary consumers (plausiden-inject, plausiden-desktop, etc.).
# Out-of-tree on non-Linux: the sandbox module compiles to a
# warning-only no-op there.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "duress_verify"
harness = false

